<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Trident Designer</title>
    <meta name="description" content="Trident - Premium custom jewelry design and creation. Expert CAD designing, rendering & manufacturing.">
    <meta name="author" content="Trident Jewellery Designer" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Resource hints for faster third-party connections -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- Preconnect for faster resource loading (kept but dns-prefetch added as fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Critical CSS inlining hint -->
    <meta name="view-transition" content="same-origin">

    <!-- Preload critical favicon -->
    <link rel="icon" href="/assets/Trident.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/assets/Trident.png" sizes="180x180" />
    <link rel="mask-icon" href="/assets/Trident.png" color="#f57e62" />

    <!-- Fonts with display=optional for faster text rendering (critical for LCP) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=optional" rel="stylesheet">

    <!-- Performance: reduce motion preference support -->
    <style>
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
